
services:
  api:
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn flight_hunter.api.app:app --host 127.0.0.1 --port 8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flight_hunter.db
      APP_SECRET_KEY: "${APP_SECRET_KEY:?run 'uv run flight-hunter-init-local' first}"
      AUTH_BOOTSTRAP_TOKEN: "${AUTH_BOOTSTRAP_TOKEN:-}"
      AUTH_ALLOW_LEGACY_HEADERS: "false"
      AUTH_LOCAL_AUTO_LOGIN: "true"
      AVIASALES_SEARCH_ENABLED: "${AVIASALES_SEARCH_ENABLED:-false}"
      AVIASALES_SEARCH_SIGNATURE: "${AVIASALES_SEARCH_SIGNATURE:-}"
      AVIASALES_SEARCH_MARKER: "${AVIASALES_SEARCH_MARKER:-}"
      AVIASALES_SEARCH_INTERNAL_RPM: "${AVIASALES_SEARCH_INTERNAL_RPM:-20}"
      TELEGRAM_ENABLED: "false"
      PERSONAL_OBSERVER_ENABLED: "false"
      SEARXNG_ENABLED: "${SEARXNG_ENABLED:-false}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
      CRAWL4AI_ENABLED: "${CRAWL4AI_ENABLED:-false}"
      CRAWL4AI_MODE: "${CRAWL4AI_MODE:-server}"
      CRAWL4AI_BASE_URL: "${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
      CRAWL4AI_TIMEOUT_SECONDS: "${CRAWL4AI_TIMEOUT_SECONDS:-30}"
    volumes:
      - flight_hunter_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    command: >
      uv run flight-hunter-worker --loop
      --roles browser,watch,deal,telegram,maintenance --idle-sleep-seconds 10
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flight_hunter.db
      APP_SECRET_KEY: "${APP_SECRET_KEY:?run 'uv run flight-hunter-init-local' first}"
      AUTH_BOOTSTRAP_TOKEN: "${AUTH_BOOTSTRAP_TOKEN:-}"
      AUTH_ALLOW_LEGACY_HEADERS: "false"
      AVIASALES_SEARCH_ENABLED: "${AVIASALES_SEARCH_ENABLED:-false}"
      AVIASALES_SEARCH_SIGNATURE: "${AVIASALES_SEARCH_SIGNATURE:-}"
      AVIASALES_SEARCH_MARKER: "${AVIASALES_SEARCH_MARKER:-}"
      AVIASALES_SEARCH_INTERNAL_RPM: "${AVIASALES_SEARCH_INTERNAL_RPM:-20}"
      TELEGRAM_ENABLED: "false"
      PERSONAL_OBSERVER_ENABLED: "false"
      SEARXNG_ENABLED: "${SEARXNG_ENABLED:-false}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
      CRAWL4AI_ENABLED: "${CRAWL4AI_ENABLED:-false}"
      CRAWL4AI_MODE: "${CRAWL4AI_MODE:-server}"
      CRAWL4AI_BASE_URL: "${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
      CRAWL4AI_TIMEOUT_SECONDS: "${CRAWL4AI_TIMEOUT_SECONDS:-30}"
    volumes:
      - flight_hunter_data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - flight-hunter-worker-healthcheck
        - --role
        - flight_hunter_worker
        - --max-age-seconds
        - "120"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  agent-worker:
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    command: >
      uv run flight-hunter-worker --loop --roles agent --idle-sleep-seconds 10
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flight_hunter.db
      APP_SECRET_KEY: "${APP_SECRET_KEY:?run 'uv run flight-hunter-init-local' first}"
      AUTH_BOOTSTRAP_TOKEN: "${AUTH_BOOTSTRAP_TOKEN:-}"
      AUTH_ALLOW_LEGACY_HEADERS: "false"
      AVIASALES_SEARCH_ENABLED: "${AVIASALES_SEARCH_ENABLED:-false}"
      AVIASALES_SEARCH_SIGNATURE: "${AVIASALES_SEARCH_SIGNATURE:-}"
      AVIASALES_SEARCH_MARKER: "${AVIASALES_SEARCH_MARKER:-}"
      AVIASALES_SEARCH_INTERNAL_RPM: "${AVIASALES_SEARCH_INTERNAL_RPM:-20}"
      AGENT_OPERATION_LEASE_SECONDS: "${AGENT_OPERATION_LEASE_SECONDS:-120}"
      AGENT_POLL_INTERVAL_SECONDS: "${AGENT_POLL_INTERVAL_SECONDS:-2}"
      AGENT_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "${AGENT_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}"
      AGENT_PROVIDER_CIRCUIT_COOLDOWN_SECONDS: "${AGENT_PROVIDER_CIRCUIT_COOLDOWN_SECONDS:-120}"
      TELEGRAM_ENABLED: "false"
      PERSONAL_OBSERVER_ENABLED: "false"
    volumes:
      - flight_hunter_data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - flight-hunter-worker-healthcheck
        - --role
        - agent
        - --max-age-seconds
        - "120"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  searxng:
    image: "${SEARXNG_IMAGE:-searxng/searxng:2026.6.29-0e990f78a}"
    profiles:
      - deal-discovery
    environment:
      BASE_URL: "${SEARXNG_PUBLIC_BASE_URL:-http://searxng:8080/}"
      INSTANCE_NAME: "flight-hunter-searxng"
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - searxng_data:/etc/searxng

  crawl4ai:
    image: "${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.8.9}"
    profiles:
      - deal-discovery
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
    expose:
      - "11235"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    volumes:
      - crawl4ai_cache:/app/.crawl4ai

volumes:
  flight_hunter_data:
  searxng_data:
  crawl4ai_cache:
